name: One-time Speak diagnostics patch

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ADD_SPEAK_DIAGNOSTICS to run this one-time patch
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    if: github.event.inputs.confirm == 'ADD_SPEAK_DIAGNOSTICS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add diagnostics only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/app/api/speak/route.ts')
          text = path.read_text()

          def replace_one(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} insertion point; found {count}')

          replace_one(
              r'(function isContextTooLong\(err: any\): boolean \{\s*const msg = err\?\.message \?\? String\(err\);\s*return msg\.includes\("context_length"\) \|\| msg\.includes\("maximum context"\) \|\| msg\.includes\("too many tokens"\) \|\| msg\.includes\("413"\);\s*\})',
              r'''\1

function getFallbackReason(err: any): string {
const msg = err?.message ?? String(err);
if (isToolUseFailed(err)) return "tool_use_failed";
if (msg.includes("context_length") || msg.includes("maximum context") || msg.includes("too many tokens") || msg.includes("413")) return "context_too_long";
if (isRateLimit(err)) return "rate_limit";
return "unknown";
}''',
              'getFallbackReason'
          )
          replace_one(
              r'(if \(isToolUseFailed\(err\) \|\| isRateLimit\(err\) \|\| isContextTooLong\(err\)\) \{\s*)(const fallbackMsgs = buildFallbackMessages\(history, message, prefetchedContext, liveBasePrompt\);)',
              r'''\1console.warn("[speak-fallback]", { stage: "primary", reason: getFallbackReason(err), error: err?.message ?? String(err) });
\2''',
              'primary fallback log'
          )
          replace_one(
              r'(if \(isToolUseFailed\(err\) \|\| isRateLimit\(err\) \|\| isContextTooLong\(err\)\) \{\s*)(const toolSummary = toolMessages)',
              r'''\1console.warn("[speak-fallback]", { stage: "after_tools", reason: getFallbackReason(err), error: err?.message ?? String(err) });
\2''',
              'post-tool fallback log'
          )
          replace_one(
              r'(const fullPrompt = `\$\{effectiveBasePrompt\}\$\{plexContext\}\\n\\nYour current emotional sediment: \$\{sediment\}\$\{modeInstruction\}`;\s*)(let response: string;)',
              r'''\1const historyChars = history.slice(-8).reduce((total: number, item: any) => total + String(item.content ?? "").length, 0);
console.info("[speak-context]", { basePromptChars: basePrompt.length, plexContextChars: plexContext.length, historyChars, prefetchedChars: prefetchedContext?.length ?? 0, fullPromptChars: fullPrompt.length, toolCount: PLEX_TOOLS.length, mode });

\2''',
              'context metrics log'
          )

          path.write_text(text)

      - name: Commit diagnostics and remove this workflow
        run: |
          git config user.name 'Manitec repair bot'
          git config user.email '95106688+Manitec@users.noreply.github.com'
          git rm .github/workflows/one-time-speak-diagnostics.yml
          git add src/app/api/speak/route.ts
          git commit -m 'chore(speak): log context budget and fallback causes'
          git push origin main
