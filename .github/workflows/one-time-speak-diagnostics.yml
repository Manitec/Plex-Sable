name: One-time Speak diagnostics patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-speak-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add diagnostics only
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/api/speak/route.ts')
          text = path.read_text()

          def insert_before(marker, addition, label):
              global text
              if text.count(marker) != 1:
                  raise SystemExit(f'Expected exactly one {label} marker; found {text.count(marker)}')
              text = text.replace(marker, addition + marker, 1)

          function_marker = 'function isContextTooLong(err: any): boolean {'
          if text.count(function_marker) != 1:
              raise SystemExit(f'Expected exactly one context function marker; found {text.count(function_marker)}')
          function_start = text.index(function_marker)
          function_end = text.index('\n}', function_start) + 2
          text = text[:function_end] + '''

function getFallbackReason(err: any): string {
const msg = err?.message ?? String(err);
if (isToolUseFailed(err)) return "tool_use_failed";
if (msg.includes("context_length") || msg.includes("maximum context") || msg.includes("too many tokens") || msg.includes("413")) return "context_too_long";
if (isRateLimit(err)) return "rate_limit";
return "unknown";
}''' + text[function_end:]

          insert_before(
              'const fallbackMsgs = buildFallbackMessages(history, message, prefetchedContext, liveBasePrompt);',
              'console.warn("[speak-fallback]", { stage: "primary", reason: getFallbackReason(err), error: err?.message ?? String(err) });\n',
              'primary fallback'
          )
          insert_before(
              'const toolSummary = toolMessages',
              'console.warn("[speak-fallback]", { stage: "after_tools", reason: getFallbackReason(err), error: err?.message ?? String(err) });\n',
              'post-tool fallback'
          )
          insert_before(
              'let response: string;',
              'const historyChars = history.slice(-8).reduce((total: number, item: any) => total + String(item.content ?? "").length, 0);\nconsole.info("[speak-context]", { basePromptChars: basePrompt.length, plexContextChars: plexContext.length, historyChars, prefetchedChars: prefetchedContext?.length ?? 0, fullPromptChars: fullPrompt.length, toolCount: PLEX_TOOLS.length, mode });\n\n',
              'response declaration'
          )

          path.write_text(text)

      - name: Commit diagnostics and remove this workflow
        run: |
          git config user.name 'Manitec repair bot'
          git config user.email '95106688+Manitec@users.noreply.github.com'
          git rm .github/workflows/one-time-speak-diagnostics.yml
          git add src/app/api/speak/route.ts
          git commit -m 'chore(speak): log context budget and fallback causes'
          git push origin main
