name: One-time Speak diagnostics patch

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ADD_SPEAK_DIAGNOSTICS to run this one-time patch
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    if: github.event.inputs.confirm == 'ADD_SPEAK_DIAGNOSTICS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add diagnostics only
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/api/speak/route.ts')
          text = path.read_text()

          replacements = [
              (
                  'function isContextTooLong(err: any): boolean {\nconst msg = err?.message ?? String(err);\nreturn msg.includes("context_length") || msg.includes("maximum context") || msg.includes("too many tokens") || msg.includes("413");\n}',
                  'function isContextTooLong(err: any): boolean {\nconst msg = err?.message ?? String(err);\nreturn msg.includes("context_length") || msg.includes("maximum context") || msg.includes("too many tokens") || msg.includes("413");\n}\n\nfunction getFallbackReason(err: any): string {\nconst msg = err?.message ?? String(err);\nif (isToolUseFailed(err)) return "tool_use_failed";\nif (msg.includes("context_length") || msg.includes("maximum context") || msg.includes("too many tokens") || msg.includes("413")) return "context_too_long";\nif (isRateLimit(err)) return "rate_limit";\nreturn "unknown";\n}'
              ),
              (
                  'if (isToolUseFailed(err) || isRateLimit(err) || isContextTooLong(err)) {\nconst fallbackMsgs = buildFallbackMessages(history, message, prefetchedContext, liveBasePrompt);',
                  'if (isToolUseFailed(err) || isRateLimit(err) || isContextTooLong(err)) {\nconsole.warn("[speak-fallback]", { stage: "primary", reason: getFallbackReason(err), error: err?.message ?? String(err) });\nconst fallbackMsgs = buildFallbackMessages(history, message, prefetchedContext, liveBasePrompt);'
              ),
              (
                  'if (isToolUseFailed(err) || isRateLimit(err) || isContextTooLong(err)) {\nconst toolSummary = toolMessages',
                  'if (isToolUseFailed(err) || isRateLimit(err) || isContextTooLong(err)) {\nconsole.warn("[speak-fallback]", { stage: "after_tools", reason: getFallbackReason(err), error: err?.message ?? String(err) });\nconst toolSummary = toolMessages'
              ),
              (
                  'const fullPrompt = `${effectiveBasePrompt}${plexContext}\n\nYour current emotional sediment: ${sediment}${modeInstruction}`;\n\nlet response: string;',
                  'const fullPrompt = `${effectiveBasePrompt}${plexContext}\n\nYour current emotional sediment: ${sediment}${modeInstruction}`;\nconst historyChars = history.slice(-8).reduce((total: number, item: any) => total + String(item.content ?? "").length, 0);\nconsole.info("[speak-context]", { basePromptChars: basePrompt.length, plexContextChars: plexContext.length, historyChars, prefetchedChars: prefetchedContext?.length ?? 0, fullPromptChars: fullPrompt.length, toolCount: PLEX_TOOLS.length, mode });\n\nlet response: string;'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source pattern not found: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit diagnostics and remove this workflow
        run: |
          git config user.name 'Manitec repair bot'
          git config user.email '95106688+Manitec@users.noreply.github.com'
          git rm .github/workflows/one-time-speak-diagnostics.yml
          git add src/app/api/speak/route.ts
          git commit -m 'chore(speak): log context budget and fallback causes'
          git push origin main
