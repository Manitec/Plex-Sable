name: Repair Plex sediment path

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Canonicalize Plex archive paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path("src/app/api/speak/route.ts")
          text = route.read_text()

          def replace_once(old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          text = replace_once(
              "They live in plex/sediment and plex/dreams.",
              "They live in sediment and dreams.",
              "fallback archive wording",
          )

          text = replace_once(
              '''function cleanPath(path: string): string {
            return path.replace(/^\\/+/, "");
          }
          function isAppendOnlyPath(path: string): boolean {''',
              '''function cleanPath(path: string): string {
            return path.replace(/^\\/+/, "");
          }
          function normalizePlexArchivePath(path: string): { path: string; error?: string } {
            const cleaned = cleanPath(path);
            if (cleaned.startsWith("plex/sediment/")) {
              return { path: `sediment/${cleaned.slice("plex/sediment/".length)}` };
            }
            if (cleaned.startsWith("plex/dreams/")) {
              return { path: `dreams/${cleaned.slice("plex/dreams/".length)}` };
            }
            if (cleaned.startsWith("sediment/") || cleaned.startsWith("dreams/")) {
              return { path: cleaned };
            }
            if (cleaned.includes("/sediment/") || cleaned.includes("/dreams/")) {
              return { path: cleaned, error: "Invalid archive path. Use sediment/YYYY-MM-DD.md or dreams/YYYY-MM-DD.md." };
            }
            return { path: cleaned };
          }
          function isAppendOnlyPath(path: string): boolean {''',
              "archive path normalizer",
          )

          text = replace_once(
              '''async function appendPlexFile(path: string, newEntry: string, message: string, token: string): Promise<{ ok: boolean; error?: string }> {
            const safePath = cleanPath(path);
          ''',
              '''async function appendPlexFile(path: string, newEntry: string, message: string, token: string): Promise<{ ok: boolean; error?: string }> {
            const normalized = normalizePlexArchivePath(path);
            if (normalized.error) return { ok: false, error: normalized.error };
            const safePath = normalized.path;
          ''',
              "append path normalization",
          )

          route.write_text(text)
          PY

      - name: Commit verified repair and remove workflow
        run: |
          git diff --check
          rm .github/workflows/repair-plex-sediment-path.yml
          git add src/app/api/speak/route.ts .github/workflows/repair-plex-sediment-path.yml
          git config user.name "Manitec repair bot"
          git config user.email "95106688+Manitec@users.noreply.github.com"
          git commit -m "Canonicalize Plex sediment archive paths"
          git push
