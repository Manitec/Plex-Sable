name: Integrate reviewed history patch

on:
  push:
    branches: [fix/plex-history-role-guard]
    paths: [.github/workflows/integrate-history.yml]

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/plex-history-role-guard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plex-history-role-guard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/integrate-session-history.mjs
      - run: node scripts/test-session-history.mjs
      - run: node scripts/test-speak-history.mjs
      - name: Commit exact route integration and remove temporary automation
        run: |
          set -eu
          git rm -- .github/workflows/repair-lockfile.yml .github/workflows/integrate-history.yml scripts/integrate-session-history.mjs
          git add -- src/app/api/speak/route.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: integrate validated history roles and persistence guard'
          git push origin HEAD:refs/heads/fix/plex-history-role-guard
      - run: npx --no-install tsc --noEmit
      - run: npm run build
