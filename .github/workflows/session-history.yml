name: Session history contract

on:
  push:
    branches:
      - main
      - fix/plex-history-role-guard
  pull_request:
    branches:
      - main
      - fix/plex-history-role-guard

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-session-history.mjs
