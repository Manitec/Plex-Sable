name: Session history contract

on:
  push:
    branches: [main, fix/plex-history-role-guard]
  pull_request:
    branches: [main, fix/plex-history-role-guard]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Node 22.18+ strips TypeScript types by default, which the module suites
      # rely on when they import src/lib/*.ts directly.
      - run: node --test test/*.test.mjs
      - run: node scripts/test-session-history.mjs
      - run: node scripts/test-speak-history.mjs
      - run: npx --no-install tsc --noEmit
