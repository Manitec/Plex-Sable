name: Repair dependency lockfile

on:
  push:
    branches: [fix/plex-history-role-guard]
    paths: [.github/workflows/repair-lockfile.yml]

permissions:
  contents: write

concurrency:
  group: plex-lockfile-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/fix/plex-history-role-guard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plex-history-role-guard
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Regenerate and verify the approved lockfile
        run: |
          set -eu
          npx --yes npm@11.19.0 install --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          printf '%s\n' '4911b7d3f5a97f7664cb184c1756ab275c8e8983c2f91140c480f14fa17f0be4  package-lock.json' | sha256sum -c -
          npx --yes npm@11.19.0 ci --ignore-scripts --no-audit --no-fund
          node scripts/test-session-history.mjs
      - name: Commit only the verified lockfile to the repair branch
        run: |
          set -eu
          test -z "$(git diff --cached --name-only)"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'Verified lockfile already committed.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: regenerate Plex-Sable dependency lockfile'
          git push origin HEAD:refs/heads/fix/plex-history-role-guard
