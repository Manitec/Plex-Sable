name: One-time fallback identity repair

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type REPAIR_FALLBACK_IDENTITY to run this one-time repair
        required: true
        type: string

permissions:
  contents: write

jobs:
  repair:
    if: github.event.inputs.confirm == 'REPAIR_FALLBACK_IDENTITY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch fallback identity handoff
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/api/speak/route.ts')
          text = path.read_text()

          replacements = [
              (
                  'function buildFallbackMessages(history: any[], message: string, prefetchedContext?: string): Groq.Chat.Completions.ChatCompletionMessageParam[] {',
                  'function buildFallbackMessages(\n  history: any[],\n  message: string,\n  prefetchedContext?: string,\n  liveBasePrompt?: string\n): Groq.Chat.Completions.ChatCompletionMessageParam[] {'
              ),
              (
                  '  const baseContent = PLEX_BASE_FALLBACK + PLEX_CONTEXT_MISSING_NOTE + FALLBACK_NO_TOOLS_NOTE;',
                  '  const baseContent = (liveBasePrompt ?? PLEX_BASE_FALLBACK) + PLEX_CONTEXT_MISSING_NOTE + FALLBACK_NO_TOOLS_NOTE;'
              ),
              (
                  '  baseUrl?: string\n): Promise<{ text: string; fallback: boolean; requestSubmitted?: string }> {',
                  '  baseUrl?: string,\n  liveBasePrompt?: string\n): Promise<{ text: string; fallback: boolean; requestSubmitted?: string }> {'
              ),
              (
                  'buildFallbackMessages(history, message, prefetchedContext)',
                  'buildFallbackMessages(history, message, prefetchedContext, liveBasePrompt)'
              ),
              (
                  'buildFallbackMessages(history, message, toolSummary || prefetchedContext)',
                  'buildFallbackMessages(history, message, toolSummary || prefetchedContext, liveBasePrompt)'
              ),
              (
                  'callGroqWithTools(fullPrompt, history, message, token, prefetchedContext, baseUrl)',
                  'callGroqWithTools(fullPrompt, history, message, token, prefetchedContext, baseUrl, basePrompt)'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source pattern not found: {old[:100]}')
              text = text.replace(old, new)

          path.write_text(text)

      - name: Verify production build
        run: npm ci && npm run build

      - name: Commit route repair and remove this workflow
        run: |
          git config user.name 'Manitec repair bot'
          git config user.email '95106688+Manitec@users.noreply.github.com'
          git rm .github/workflows/one-time-fallback-identity-repair.yml
          git add src/app/api/speak/route.ts
          git commit -m 'fix(speak): preserve live base identity during fallback'
          git push origin main
